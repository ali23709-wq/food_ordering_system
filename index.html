<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Khana - Pakistani Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger fixed-top shadow-lg">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="#">🍛 Desi Khana</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#menu">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span id="cart-count" class="badge bg-light text-danger">0</span></a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="login.html">Login</a></li>
                            <li><a class="dropdown-item" href="register.html">Register</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="admin-login.html">Admin Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero min-vh-100 d-flex align-items-center text-white" style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('images/food/chicken-biryani.jpg') center/cover no-repeat !important;
    background-attachment: fixed;">
        <div class="container" data-aos="fade-up">
            <h1 class="display-3 fw-bold">Authentic Pakistani Food <br>Delivered Hot & Fresh</h1>
            <p class="lead my-4">Biryani, Nihari, Karahi, Haleem, Seekh Kabab aur bohot kuch!</p>
            <a href="menu.html" class="btn btn-warning btn-lg px-5 py-3 animate__animated animate__pulse animate__infinite">Order Now</a>
        </div>
    </section>

    <!-- Popular Items -->
    <section class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-5" data-aos="fade-down">Most Loved Dishes</h2>
            <div class="row g-4">
                <div class="col-md-4" data-aos="zoom-in">
                    <div class="card h-100 shadow-lg border-0 hover-card">
                        <img src="images/chicken-biryani.jpg" class="card-img-top" alt="Chicken Biryani">
                        <div class="card-body text-center">
                            <h5>Chicken Biryani</h5>
                            <p class="text-danger fw-bold">Rs. 450</p>
                            <button class="btn btn-danger add-to-cart" data-name="Chicken Biryani" data-price="450">Add to Cart</button>
                        </div>
                    </div>
                </div>
                <!-- Repeat similar cards for 5-6 popular items -->
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
    <script>AOS.init({duration: 1200});</script>
</body>
</html>
