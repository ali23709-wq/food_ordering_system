<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register - Desi Khana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card bg-secondary text-white" style="max-width: 400px; width: 100%;">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Admin Registration</h2>
                <form>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Admin Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Admin Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Secret Key (12345)" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Register as Admin</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
