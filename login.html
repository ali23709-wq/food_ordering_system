<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Desi Khana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg border-0" style="max-width: 420px; width: 100%;" data-aos="zoom-in">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h1 class="text-danger fw-bold">🍛 Desi Khana</h1>
                    <h4 class="mt-3">Welcome Back!</h4>
                    <p class="text-muted">Login to order your favorite Pakistani food</p>
                </div>

                <form id="userLoginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control form-control-lg" placeholder="example@gmail.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <a href="#" class="text-danger text-decoration-none">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold">
                        <i class="fas fa-sign-in-alt"></i> Login Now
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-2">Don't have an account?</p>
                    <a href="register.html" class="btn btn-outline-danger w-100">Create New Account</a>
                </div>

                <div class="text-center mt-3">
                    <a href="index.html" class="btn btn-secondary btn-sm">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800 });

        document.getElementById('userLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Simple success animation
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;

            setTimeout(() => {
                alert('Login Successful! 🎉\nWelcome back to Desi Khana!');
                window.location.href = 'menu.html';
            }, 1500);
        });
    </script>
</body>
</html>
