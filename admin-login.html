<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card bg-secondary text-white border-0 shadow-lg" style="max-width: 400px; width: 100%;">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 text-danger fw-bold">ADMIN LOGIN</h2>
                <form id="adminLogin">
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Admin Email" value="admin@desikhana.com">
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Password" value="admin123">
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold">Login as Admin</button>
                </form>
                <div class="text-center mt-3">
                    <small>Default: admin@desikhana.com / admin123</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('adminLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.querySelector('input[type="email"]').value;
            const pass = this.querySelector('input[type="password"]').value;
            
            if(email === "admin@desikhana.com" && pass === "admin123") {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Wrong Credentials!');
            }
        });
    </script>
</body>
</html>
