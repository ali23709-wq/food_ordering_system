<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Desi Khana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Same Navbar -->

    <div class="container my-5 pt-5">
        <h2>Your Cart 🛒</h2>
        <div id="cart-items"></div>
        <h3 id="total-amount" class="text-danger mt-4">Total: Rs. 0</h3>

        <div class="card mt-4">
            <div class="card-body">
                <h4>Delivery Details</h4>
                <form id="orderForm">
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="tel" class="form-control" placeholder="Phone" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" rows="3" placeholder="Complete Address" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger btn-lg w-100">Place Order Now</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartDiv = document.getElementById('cart-items');
        let total = 0;

        if(cart.length === 0) {
            cartDiv.innerHTML = "<p>Your cart is empty 😔</p>";
        } else {
            cart.forEach((item, index) => {
                total += item.price;
                cartDiv.innerHTML += `
                    <div class="d-flex justify-content-between align-items-center border-bottom py-3">
                        <div>
                            <h5>${item.name}</h5>
                        </div>
                        <div>
                            <strong>Rs. ${item.price}</strong>
                            <button class="btn btn-sm btn-outline-danger ms-3" onclick="removeFromCart(${index})">Remove</button>
                        </div>
                    </div>`;
            });
        }
        document.getElementById('total-amount').innerHTML = `Total: Rs. ${total}`;

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            location.reload();
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert(`Order Placed Successfully! Total: Rs. ${total}\nWe will deliver in 30-45 mins 🚀`);
            localStorage.removeItem('cart');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
